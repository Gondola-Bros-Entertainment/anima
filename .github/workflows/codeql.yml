name: CodeQL

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# As in CI, only a newer push to the same pull request supersedes an analysis. A called workflow sees its
# caller's context, so the prefix keeps this group apart from the calling run's.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze / ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, c-cpp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          # Use repository source without building downloaded dependencies.
          # Compiler, runtime and sanitizer checks run separately in CI.
          build-mode: none
          config: |
            paths-ignore:
              - third_party/**
              - build/**
      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
